name: EV charger
products:
  - id: o4zjlnwqwe0dzitl
    manufacturer: Tera
    model: 22kW 32A 3 phase
  - id: y1aaoebcwzy0jvy3
    manufacturer: Tera
    model: 22kW 32A 3 phase
entities:
  - entity: sensor
    translation_key: status
    icon: "mdi:ev-station"
    class: enum
    dps:
      - id: 3  # work_state
        type: string
        name: sensor
        mapping:
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_pause
            value: paused
          - dps_val: charger_end
            value: charged
          - dps_val: charger_fault
            value: fault
      - id: 23  # system_version
        type: string
        name: system_version
  - entity: sensor
    class: energy
    dps:
      - id: 1  # forward_energy_total
        type: integer
        optional: true
        name: sensor
        class: total_increasing
        unit: kWh
        mapping:
          - scale: 100
  - entity: number
    name: Max current
    category: config
    class: current
    icon: "mdi:ev-plug-type2"
    dps:
      - id: 4  # charge_cur_set
        type: integer
        name: value
        unit: A
        range:
          min: 8
          max: 32
  - entity: sensor
    name: L1 voltage
    class: voltage
    dps:
      - id: 6  # phase_1
        type: base64
        name: sensor
        class: measurement
        optional: true
        unit: V
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    name: L1 current
    class: current
    dps:
      - id: 6  # phase_1
        type: base64
        name: sensor
        optional: true
        class: measurement
        unit: A
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    name: L1 power
    class: power
    dps:
      - id: 6  # phase_1
        type: base64
        name: sensor
        optional: true
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    name: L2 voltage
    class: voltage
    dps:
      - id: 7  # phase_2
        type: base64
        name: sensor
        optional: true
        class: measurement
        unit: V
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    name: L2 current
    class: current
    dps:
      - id: 7  # phase_2
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    name: L2 power
    class: power
    dps:
      - id: 7  # phase_2
        type: base64
        name: sensor
        optional: true
        class: measurement
        unit: kW
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    name: L3 voltage
    class: voltage
    dps:
      - id: 8  # phase_3
        type: base64
        name: sensor
        optional: true
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    name: L3 current
    class: current
    dps:
      - id: 8  # phase_3
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    name: L3 power
    class: power
    dps:
      - id: 8  # phase_3
        type: base64
        name: sensor
        optional: true
        class: measurement
        unit: kW
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 9  # power_total
        type: integer
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 10  # fault
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 10  # fault
        type: bitfield
        name: fault_code
      - id: 10  # fault
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Over current
          - dps_val: 2
            value: Over current 2
          - dps_val: 4
            value: Over voltage
          - dps_val: 8
            value: Under voltage
          - dps_val: 16
            value: Contactor adhesion
          - dps_val: 32
            value: Contactor fault
          - dps_val: 64
            value: Earth fault
          - dps_val: 128
            value: Meter hardware fault
          - dps_val: 256
            value: Emergency stop
          - dps_val: 512
            value: CP fault
          - dps_val: 1024
            value: Meter communication fault
          - dps_val: 2048
            value: Card reader fault
          - dps_val: 4096
            value: Short circuit
          - dps_val: 8192
            value: Adhesion fault
          - dps_val: 16384
            value: Self test fault
          - dps_val: 32768
            value: Leakage current
      - id: 120  # error_data
        type: string
        optional: true
        name: error_data
  - entity: sensor
    name: Connection
    icon: "mdi:ev-plug-type2"
    class: enum
    translation_key: status
    dps:
      - id: 13  # connection_state
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: standby
          - dps_val: controlpi_12v_pwm
            value: Communication initialising
          - dps_val: controlpi_9v
            value: Vehicle detected
          - dps_val: controlpi_9v_pwm
            value: Vehicle connected
          - dps_val: controlpi_6v
            value: Ready to charge
          - dps_val: controlpi_6v_pwm
            value: charging
          - dps_val: controlpi_error
            value: fault
  - entity: select
    translation_key: charging_mode
    category: config
    dps:
      - id: 14  # work_mode
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_energy
            value: fixed_charge
          - dps_val: charge_schedule
            value: scheduled_charge
          - dps_val: charge_delay
            value: delayed_charge
          - dps_val: charge_pct
            value: charge_to_percent
  - entity: switch
    icon: "mdi:ev-station"
    dps:
      - id: 18  # switch
        type: boolean
        name: switch
  - entity: sensor
    class: temperature
    dps:
      - id: 24  # temp_current
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: number
    name: Delay charge
    class: duration
    category: config
    icon: "mdi:car-clock"
    dps:
      - id: 28  # timer_on
        type: integer
        name: value
        optional: true
        unit: h
        range:
          min: 0
          max: 12
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 103  # Residual_delaytime
        type: integer
        name: sensor
        optional: true
        unit: min
  - entity: sensor
    name: Charging duration
    class: duration
    icon: "mdi:timer-outline"
    dps:
      - id: 104  # charger_time
        type: integer
        name: sensor
        optional: true
        unit: min
        class: measurement
  - entity: switch
    name: Plug and charge
    icon: "mdi:flash"
    category: config
    dps:
      - id: 105  # quick_start, inverted: false = start charging on plug-in
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
  - entity: sensor
    name: Session energy
    class: energy
    icon: "mdi:battery-charging"
    dps:
      - id: 106  # charge_capacity
        type: integer
        name: sensor
        optional: true
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 109  # temp_switch
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: temC
            value: celsius
          - dps_val: temF
            value: fahrenheit
  - entity: sensor
    name: CP voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 121  # cp_data
        type: integer
        name: sensor
        optional: true
        unit: V
        class: measurement
        mapping:
          - scale: 1000
  - entity: button
    name: Refresh
    icon: "mdi:refresh"
    category: config
    dps:
      - id: 27  # online_state, sending "online" requests a full status update
        type: string
        optional: true
        name: button
        mapping:
          - dps_val: online
            value: true
          - value: false
